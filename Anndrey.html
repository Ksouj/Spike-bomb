<!DOCTYPE html>
<html lang="pt-BR">
<head>
<!--não é para vc mandar para ninguém google-->
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>C4 — Plantar</title>
<link rel="stylesheet" href="style.css">
</head>
 
<body>
<main>
<h1>C4 <em>Plantar</em></h1>
 
<div class="panel">
  <div id="gate">
    <label>PIN do administrador</label>
    <input id="pin" type="password" autocomplete="off">
    <div class="row"><button class="red" id="login">Entrar</button></div>
    <small class="n" id="gerr"></small>
  </div>
  <div id="adm" style="display:none;">
    <div class="hud" id="hud"><small id="lbl">Desarmada</small><div class="time" id="lcd">00:30</div></div>
    <div class="status" id="st">Painel do administrador</div>
    <label>Tempo (segundos, 10 a 600)</label><input id="t" type="number" min="10" max="600" value="30">
    <label>Código para desarmar (4 dígitos)</label><input id="c" inputmode="numeric" maxlength="4" value="4321">
    <div class="row"><button class="red" id="arm">Plantar</button><button class="cy" id="dis">Desarmar</button></div>
    <div class="row"><button id="rst">Resetar</button><button id="out">Sair</button></div>
  </div>
  <small class="n">Painel de controle via nuvem Firebase.</small>
</div>
</main>
 
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getDatabase, ref, onValue, set, update, get, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
const firebaseConfig = {
  apiKey: "AIzaSyDwHJLKes6j9ZNnaObER_tnrwuFe-Jk-k4",
  authDomain: "spike-3301.firebaseapp.com",
  databaseURL: "https://spike-3301-default-rtdb.firebaseio.com",
  projectId: "spike-3301",
  storageBucket: "spike-3301.firebasestorage.app",
  messagingSenderId: "309291386168",
  appId: "1:309291386168:web:074fb3d69aac7517a76dcd",
  measurementId: "G-FCNQGJ7DRX"
};
 
let db = null;
try {
  const app = initializeApp(firebaseConfig);
  db = getDatabase(app);
} catch (e) {
  console.error("Erro ao iniciar Firebase:", e);
}
 
var S = { total: 30, left: 30, armed: false, fimEm: 0 }, tm = null;
 
// Relógio do servidor Firebase (evita diferença entre os relógios dos aparelhos)
var off = 0;
if (db) onValue(ref(db, '.info/serverTimeOffset'), function(sn) { off = sn.val() || 0; });
function now() { return Date.now() + off; }
var $ = function(i) { return document.getElementById(i); };
var lcd = $("lcd"), hud = $("hud"), st = $("st"), lbl = $("lbl");
 
function fmt(s) { return String(Math.floor(s/60)).padStart(2,"0") + ":" + String(s%60).padStart(2,"0"); }
function draw(c) {
    if (lcd) lcd.textContent = fmt(S.left);
    if (hud) hud.className = "hud " + (c || (S.armed && S.left <= 10 ? "hot" : ""));
}
 
function stop() {
    clearInterval(tm);
    tm = null;
    S.armed = false;
}
 
function tick() {
    if (!S.armed) return;
    var nl = Math.max(0, Math.ceil((S.fimEm - now()) / 1000));
    if (nl === S.left) return;
    S.left = nl;
 
    if (S.left <= 0) {
        stop();
        if (lbl) lbl.textContent = "Detonada";
        draw("hot");
        if (st) st.textContent = "A bomba detonou!";
        if (db) set(ref(db, 'bomba/status'), 'DETONADA');
        return;
    }
 
    draw();
    if (db) set(ref(db, 'bomba/tempoRestante'), S.left);
}
 
// Inicializa a escuta do Firebase de forma protegida
if (db) {
    try {
        onValue(ref(db, 'bomba'), (snapshot) => {
            const data = snapshot.val();
            if (!data) return;
            
            if (data.status === 'DESARMADA') {
                if (S.armed) {
                    stop();
                    if (lbl) lbl.textContent = "Desarmada";
                    draw("ok");
                    if (st) st.textContent = "Bomba desarmada pelo jogador!";
                }
            } else if (data.status === 'DETONADA') {
                stop();
                S.left = 0;
                if (lbl) lbl.textContent = "Detonada";
                draw("hot");
                if (st) st.textContent = "A bomba detonou!";
            } else if (data.status === 'ARMADA') {
                if (!S.armed) {
                    // Página recarregada com a bomba já armada: retoma de onde está
                    S.total = data.tempoTotal || 30;
                    S.fimEm = (typeof data.fimEm === 'number') ? data.fimEm : now() + (data.tempoRestante || S.total) * 1000;
                    S.left = -1;
                    S.armed = true;
                    $("t").value = S.total;
                    if (data.senha) $("c").value = data.senha;
                    if (lbl) lbl.textContent = "Armada";
                    if (st) st.textContent = "Bomba armada";
                    if (!tm) tm = setInterval(tick, 250);
                    tick();
                } else if (typeof data.fimEm === 'number' && data.fimEm !== S.fimEm) {
                    S.fimEm = data.fimEm;
                    tick();
                }
            }
        });
    } catch (err) {
        console.error("Erro no onValue:", err);
    }
}
 
// Ações de Login totalmente blindadas
const pinInput = $("pin");
const loginBtn = $("login");
 
if (pinInput) {
    pinInput.addEventListener("keydown", function(e) {
        if (e.key === "Enter") {
            loginBtn.click();
        }
    });
}
 
if (loginBtn) {
    loginBtn.onclick = async function() {
        const pinDigitado = pinInput.value.trim();
        
        // Validação principal e imediata com a tua senha de administrador
        if (pinDigitado === "Anndreychupilei") {
            $("gate").style.display = "none";
            $("adm").style.display = "block";
            pinInput.value = "";
            $("gerr").textContent = "";
            return;
        }
 
        // Se falhar a senha direta, tenta validar no Firebase se estiver disponível
        if (!db) {
            $("gerr").textContent = "PIN incorreto";
            return;
        }
 
        try {
            const pinRef = ref(db, 'bomba/config/adminPin');
            const snapshot = await get(pinRef);
            
            let pinReal = "Anndreychupilei"; 
            if (snapshot.exists()) {
                pinReal = String(snapshot.val()).trim();
            }
 
            if (pinDigitado === pinReal) {
                $("gate").style.display = "none";
                $("adm").style.display = "block";
                pinInput.value = "";
                $("gerr").textContent = "";
            } else {
                $("gerr").textContent = "PIN incorreto";
            }
        } catch (error) {
            console.error("Erro ao validar PIN no Firebase:", error);
            $("gerr").textContent = "PIN incorreto";
        }
    };
}
 
// Troca do código em tempo real: com a bomba armada, cada código válido (4 dígitos) vai direto pro Firebase
$("c").addEventListener("input", function() {
    this.value = this.value.replace(/\D/g, "").slice(0, 4);
    if (!S.armed || !db) return;
    if (this.value.length === 4) {
        set(ref(db, 'bomba/senha'), this.value);
        if (st) st.textContent = "Código atualizado em tempo real";
    } else if (st) {
        st.textContent = "Digite os 4 dígitos para trocar o código";
    }
});
 
// Resetar: volta tudo ao modo de início (admin e jogador ficam em "Aguardando")
$("rst").onclick = function() {
    stop();
    S.total = S.left = 30;
    $("t").value = 30;
    $("c").value = "4321";
    if (lbl) lbl.textContent = "Desarmada";
    draw();
    if (st) st.textContent = "Painel do administrador";
    if (db) set(ref(db, 'bomba'), { status: 'DESARMADA', reset: true });
};
 
$("out").onclick = function() {
    $("adm").style.display = "none";
    $("gate").style.display = "block";
};
 
$("arm").onclick = function() {
    var t = parseInt($("t").value, 10);
    t = (t >= 10 && t <= 600) ? t : 30;
    if (!/^\d{4}$/.test($("c").value)) {
        if (st) st.textContent = "O código precisa ter 4 dígitos";
        return;
    }
    stop();
    S.total = S.left = t;
    S.fimEm = now() + t * 1000;
    S.armed = true;
    if (lbl) lbl.textContent = "Armada";
    draw();
    if (st) st.textContent = "Bomba armada";
    
    if (db) {
        // O fim da contagem é calculado com a hora do SERVIDOR (não com o relógio deste aparelho)
        set(ref(db, 'bomba'), {
            status: 'ARMADA',
            armId: Date.now(),
            armadoEm: serverTimestamp(),
            senha: $("c").value,
            tempoTotal: t,
            tempoRestante: t
        }).then(function() { return get(ref(db, 'bomba/armadoEm')); })
          .then(function(sn) { return update(ref(db, 'bomba'), { fimEm: sn.val() + t * 1000 }); })
          .catch(function(e) { console.error("Erro ao armar:", e); });
    }
    
    if (!tm) tm = setInterval(tick, 250);
};
 
$("dis").onclick = function() {
    stop();
    if (lbl) lbl.textContent = "Desarmada";
    draw("ok");
    if (st) st.textContent = "Bomba desarmada pelo Administrador";
    if (db) set(ref(db, 'bomba'), { status: 'DESARMADA' });
};
</script>
</body>
</html>
