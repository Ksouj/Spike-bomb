<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPIKE ADMIN - Login</title>
    <style>
        /* Estilos Globais e Fundo */
        body {
            background-color: #101620; /* Azul escuro idêntico à imagem */
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        /* Título Principal (Branco e Vermelho) */
        .main-title {
            font-size: 36px;
            font-weight: bold;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .main-title .white {
            color: #ffffff;
        }
        .main-title .red {
            color: #ff3b5c; /* Vermelho vibrante */
        }

        /* Cartão de Login */
        .login-card {
            background-color: #161d29; /* Ligeiramente mais claro que o fundo */
            border: 1px solid #2a3649; /* Borda fina visível */
            padding: 40px;
            width: 100%;
            max-width: 400px;
            border-radius: 4px; /* Cantos pouco arredondados */
            text-align: center;
            box-sizing: border-box;
        }

        /* Label do Campo */
        .field-label {
            color: #8a9ab0; /* Cinza azulado */
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
            display: block;
            text-align: left;
        }

        /* Campo de Entrada (PIN) */
        .pin-input {
            width: 100%;
            background-color: #0c1119; /* Fundo escuro do input */
            border: 1px solid #2a3649;
            color: #ffffff;
            padding: 15px;
            font-size: 16px;
            border-radius: 4px;
            margin-bottom: 20px;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }
        .pin-input:focus {
            outline: none;
            border-color: #ff3b5c; /* Borda vermelha no foco */
        }

        /* Botão ENTRAR */
        .btn-entrar {
            width: 100%;
            background-color: #ff3b5c; /* Vermelho vibrante */
            color: #ffffff;
            border: none;
            padding: 15px;
            font-size: 16px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .btn-entrar:hover {
            background-color: #e03250;
        }

        /* Rodapé do Cartão */
        .card-footer {
            color: #5c6d84;
            font-size: 12px;
            margin-top: 20px;
        }

        /* Painel de Controlo (Escondido inicialmente) */
        #painelControlo {
            display: none;
        }
        .btn-control {
            margin: 10px 0;
            background-color: #2a3649; /* Cor neutra para controlos */
        }
        .btn-detonar {
            background-color: #ff3b5c; /* Vermelho para detonar */
        }
    </style>
</head>
<body>

    <!-- Título Principal -->
    <div class="main-title">
        <span class="white">SPIKE</span> <span class="red">ADMIN</span>
    </div>

    <!-- SECÇÃO DE LOGIN -->
    <div class="login-card" id="secaoLogin">
        <label class="field-label" for="inputAdminPin">PIN DO ADMINISTRADOR</label>
        <input type="password" id="inputAdminPin" class="pin-input" placeholder="••••">
        
        <button class="btn-entrar" onclick="verificarAdminPin()">ENTRAR</button>

        <div class="card-footer">
            Painel de controle via nuvem Firebase.
        </div>
    </div>

    <!-- SECÇÃO DE CONTROLOS (OCULTA ATÉ AUTENTICAÇÃO) -->
    <div class="login-card" id="painelControlo">
        <div class="field-label">CONTROLOS DA BOMBA</div>
        <button class="btn-entrar btn-control" onclick="mudarStatus('ARMADA')">ARMAR BOMBA</button>
        <button class="btn-entrar btn-control" onclick="mudarStatus('DESARMADA')">DESARMAR</button>
        <button class="btn-entrar btn-detonar" onclick="mudarStatus('DETONADA')">DETONAR AGORA</button>
    </div>

    <!-- Script do Firebase v10 (Modular) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getDatabase, ref, get, set } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

        // CONFIGURAÇÃO DO TEU FIREBASE (Verifica se o URL está correto)
        const firebaseConfig = {
            databaseURL: "https://spike-3301-default-rtdb.firebaseio.com"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Função segura para validar o PIN
        window.verificarAdminPin = async function() {
            const pinDigitado = document.getElementById("inputAdminPin").value;
            const pinRef = ref(db, 'pump/config/adminPin'); // Caminho no teu Firebase

            try {
                const snapshot = await get(pinRef);
                if (snapshot.exists()) {
                    const pinReal = snapshot.val();

                    if (pinDigitado === String(pinReal)) {
                        document.getElementById("secaoLogin").style.display = "none";
                        document.getElementById("painelControlo").style.display = "block";
                    } else {
                        alert("PIN Incorreto!");
                        document.getElementById("inputAdminPin").value = "";
                    }
                } else {
                    alert("Erro: PIN não configurado no servidor.");
                }
            } catch (error) {
                console.error("Erro Firebase:", error);
            }
        };

        // Função para mudar o status
        window.mudarStatus = async function(novoStatus) {
            try {
                await set(ref(db, 'pump/status'), novoStatus);
                alert("Status atualizado: " + novoStatus);
            } catch (error) {
                console.error("Erro Firebase:", error);
            }
        };
    </script>
</body>
</html>
