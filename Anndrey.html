<!DOCTYPE html>
<html lang="pt-BR">
<head>

<!--não é para vc mandar para ninguém google-->
    <meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>SPIKE — Administrador</title>
<link rel="stylesheet" href="style.css">
</head>

<body>
<main>
<h1>Spike <em>Admin</em></h1>

<!--rapaz nesse dia eu estava louco kkkkk-->
<!--nem eu sei o que isso faz direito, só Deus sabe-->

<div class="panel">
  <div id="gate">
    <label>PIN do administrador</label>
    <input id="pin" type="password" inputmode="numeric" autocomplete="off">
    <div class="row"><button class="red" id="login">Entrar</button></div>
    <small class="n" id="gerr"></small>
  </div>
  <div id="adm">
    <div class="hud" id="hud"><small id="lbl">Desarmada</small><div class="time" id="lcd">00:30</div></div>
    <div class="status" id="st">Painel do administrador</div>
    <label>Tempo (segundos, 10 a 600)</label><input id="t" type="number" min="10" max="600" value="30">
    <label>Código para desarmar (4 dígitos)</label><input id="c" inputmode="numeric" maxlength="4" value="4321">
    <div class="row"><button class="red" id="arm">Armar</button><button class="cy" id="dis">Desarmar</button></div>
    <div class="row"><button id="m10">−10 s</button><button id="p10">+10 s</button><button id="out">Sair</button></div>
  </div>
  <small class="n">Painel de controle via nuvem Firebase.</small>
</div>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getDatabase, ref, onValue, set, update, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyDwHJLKes6j9ZNnaObER_tnrwuFe-Jk-k4",
  authDomain: "spike-3301.firebaseapp.com",
  databaseURL: "https://spike-3301-default-rtdb.firebaseio.com",
  projectId: "spike-3301",
  storageBucket: "spike-3301.firebasestorage.app",
  messagingSenderId: "309291386168",
  appId: "1:309291386168:web:074fb3d69aac7517a76dcd",
  measurementId: "G-FCNQGJ7DRX"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

var S={total:30,left:30,armed:false},tm=null,ac=null;
var $=function(i){return document.getElementById(i)};
var lcd=$("lcd"),hud=$("hud"),st=$("st"),lbl=$("lbl");

function fmt(s){return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}
function beep(f,d){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();var o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;g.gain.value=.06;o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}

function draw(c){
    lcd.textContent=fmt(S.left);
    hud.className="hud "+(c||(S.armed&&S.left<=10?"hot":""));
}

function stop(){
    clearInterval(tm);
    S.armed=false;
}

function tick(){
    S.left--;
    beep(900,.05);
    update(ref(db, 'bomba'), { tempoRestante: S.left });
    if(S.left<=0){
        S.left=0;
        stop();
        lbl.textContent="Detonada";
        draw("hot");
        st.textContent="A bomba detonou!";
        set(ref(db, 'bomba/status'), 'DETONADA');
        return;
    }
    draw();
}

onValue(ref(db, 'bomba'), (snapshot) => {
    const data = snapshot.val();
    if (!data) return;
    if (data.status === 'DESARMADA') {
        if (S.armed) {
            stop();
            lbl.textContent="Desarmada";
            draw("ok");
            st.textContent="Bomba desarmada pelo jogador!";
        }
    } else if (data.status === 'ARMADA' && data.tempoRestante !== undefined) {
        if (S.armed && data.tempoRestante < S.left) {
            S.left = data.tempoRestante;
            draw();
        }
    }
});

// Verificação do PIN diretamente no Firebase (Seguro contra Inspecionar Elemento)
$("pin").addEventListener("keydown", async function(e) {
    if (e.key === "Enter") {
        $("login").click();
    }
});

$("login").onclick = async function() {
    const pinDigitado = $("pin").value;
    const pinRef = ref(db, 'bomba/config/adminPin');

    try {
        const snapshot = await get(pinRef);
        const pinReal = snapshot.exists() ? snapshot.val() : "9999"; // Fallback se não existir

        if (pinDigitado === String(pinReal)) {
            $("gate").style.display="none";
            $("adm").style.display="block";
            $("pin").value="";
            $("gerr").textContent="";
        } else {
            $("gerr").textContent="PIN incorreto";
        }
    } catch (error) {
        console.error("Erro ao validar PIN:", error);
        $("gerr").textContent="Erro ao validar PIN";
    }
};

$("out").onclick=function(){
    $("adm").style.display="none";
    $("gate").style.display="block";
};

$("arm").onclick=function(){
    var t=parseInt($("t").value,10);
    t=(t>=10&&t<=600)?t:30;
    if(!/^\d{4}$/.test($("c").value)){
        st.textContent="O código precisa ter 4 dígitos";
        return;
    }
    stop();
    S.total=S.left=t;
    S.armed=true;
    lbl.textContent="Armada";
    draw();
    st.textContent="Bomba armada";
    set(ref(db, 'bomba'), {
        status: 'ARMADA',
        senha: $("c").value,
        tempoTotal: t,
        tempoRestante: t
    });
    tm=setInterval(tick,1000);
};

$("dis").onclick=function(){
    stop();
    lbl.textContent="Desarmada";
    draw("ok");
    st.textContent="Bomba desarmada pelo Administrador";
    set(ref(db, 'bomba'), { status: 'DESARMADA' });
};

$("m10").onclick=function(){
    if(!S.armed) return;
    S.left=Math.max(1, S.left - 10);
    update(ref(db, 'bomba'), { tempoRestante: S.left });
    draw();
};

$("p10").onclick=function(){
    if(!S.armed) return;
    S.left=Math.min(600, S.left + 10);
    update(ref(db, 'bomba'), { tempoRestante: S.left });
    draw();
};
</script>
</body>
</html>
