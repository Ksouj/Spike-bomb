<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Controlo Secreto</title>
    <style>
        body {
            background-color: #0b0b0b;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 50px;
        }
        .container {
            max-width: 450px;
            margin: 0 auto;
            background: #1a1a1a;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.2);
        }
        input, button {
            padding: 12px;
            font-size: 18px;
            margin: 10px 0;
            border-radius: 5px;
            border: none;
            width: 80%;
        }
        input {
            text-align: center;
            background: #2b2b2b;
            color: white;
        }
        button {
            background-color: #00adb5;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #007e85;
        }
        .btn-perigo {
            background-color: #ff3333;
        }
        .btn-perigo:hover {
            background-color: #cc0000;
        }
        #painelControlo {
            display: none; /* Fica escondido até colocar o PIN correto */
        }
    </style>
</head>
<body>

    <!-- SECÇÃO DE LOGIN DO ADMIN -->
    <div class="container" id="secaoLogin">
        <h2>Painel Restrito</h2>
        <p>Insere o PIN de administrador:</p>
        <input type="password" id="inputAdminPin" placeholder="PIN (ex: 9999)">
        <br>
        <button onclick="verificarAdminPin()">Entrar</button>
    </div>

    <!-- SECÇÃO DE CONTROLOS (OCULTA ATÉ AUTENTICAÇÃO) -->
    <div class="container" id="painelControlo">
        <h2>Controlo da Bomba</h2>
        <p style="color: #00cc66;">Acesso Autorizado</p>
        <br>
        <button onclick="mudarStatus('ARMADA')">ARMAR BOMBA</button>
        <br>
        <button onclick="mudarStatus('DESARMADA')">DESARMAR</button>
        <br>
        <button class="btn-perigo" onclick="mudarStatus('DETONADA')">DETONAR AGORA (TESTE)</button>
    </div>

    <!-- Script do Firebase v10 (Modular) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getDatabase, ref, get, set } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

        // CONFIGURAÇÃO DO TEU FIREBASE
        const firebaseConfig = {
            databaseURL: "https://spike-3301-default-rtdb.firebaseio.com"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Função para validar o PIN de administrador diretamente no Firebase de forma segura
        window.verificarAdminPin = async function() {
            const pinDigitado = document.getElementById("inputAdminPin").value;
            const pinRef = ref(db, 'pump/config/adminPin');

            try {
                const snapshot = await get(pinRef);
                if (snapshot.exists()) {
                    const pinReal = snapshot.val();

                    if (pinDigitado === String(pinReal)) {
                        // Esconde o login e mostra o painel de controlo verdadeiro
                        document.getElementById("secaoLogin").style.display = "none";
                        document.getElementById("painelControlo").style.display = "block";
                    } else {
                        alert("PIN Incorreto!");
                    }
                } else {
                    alert("Erro: PIN não configurado no banco de dados.");
                }
            } catch (error) {
                console.error("Erro ao validar PIN:", error);
                alert("Erro ao ligar ao servidor.");
            }
        };

        // Função para alterar o estado da bomba (Armada, Desarmada, Detonada)
        window.mudarStatus = async function(novoStatus) {
            try {
                await set(ref(db, 'pump/status'), novoStatus);
                alert("Estado atualizado para: " + novoStatus);
            } catch (error) {
                console.error("Erro ao atualizar status:", error);
                alert("Falha ao comunicar com o servidor.");
            }
        };
    </script>
</body>
</html>
