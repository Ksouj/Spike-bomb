<head>

<title>SPIKE — Desarme</title>
<link rel="stylesheet" href="style.css">
<style>
/* Correção forçada para o layout do teclado numérico não desalinhar */
.keypad {
    display: grid !important;
    grid-template-columns: repeat(3, 1fr) !important;
    gap: 10px;
    width: 100%;
    max-width: 300px;
    margin: 20px auto 0;
}
</style>
</head>

<body>
<main>
<h1>Spike <em>Desarme</em></h1>

<div class="panel">

  <div class="status" id="st">Aguardando o administrador armar a bomba...</div>
  
  <div class="pad-container">
    <div class="code-display" id="codeDisplay">Código: </div>
    <div class="keypad">
      <button class="key" data-val="1">1</button>
      <button class="key" data-val="2">2</button>
      <button class="key" data-val="3">3</button>
      <button class="key" data-val="4">4</button>
      <button class="key" data-val="5">5</button>
      <button class="key" data-val="6">6</button>
      <button class="key" data-val="7">7</button>
      <button class="key" data-val="8">8</button>
      <button class="key" data-val="9">9</button>
      <button class="key" data-val="*">*</button>
      <button class="key" data-val="0">0</button>
      <button class="key" data-val="#">#</button>
    </div>
  </div>
  <small class="n">Sistema de desarme em tempo real.</small>
</div>
</main>

var bombaArmada = false;
var tempoRestante = 30;

var lcd = document.getElementById("lcd");
var hud = document.getElementById("hud");
var st = document.getElementById("st");
var lbl = document.getElementById("lbl");
var codeDisplay = document.getElementById("codeDisplay");

function fmt(s) {
    return String(Math.floor(s/60)).padStart(2,"0") + ":" + String(s%60).padStart(2,"0");
}

function atualizarDisplay() {
    if (lcd) lcd.textContent = fmt(tempoRestante);
}

// Função centralizada para processar os dígitos (teclado físico ou virtual)
function processarDigito(val) {
    if (!bombaArmada) return;

    if (val === '#' || val === 'Enter') {
        if (codigoInserido === String(senhaSecreta)) {
            if (st) st.textContent = "Código correto! Bomba desarmada!";
            set(ref(db, 'bomba/status'), 'DESARMADA');
        } else {
            if (st) st.textContent = "Código incorreto! Tente novamente.";
            codigoInserido = "";
            if (codeDisplay) codeDisplay.textContent = "Código: ";
        }
    } else if (val === '*' || val === 'Backspace') {
        if (val === 'Backspace') {
            codigoInserido = codigoInserido.slice(0, -1);
        } else {
            codigoInserido = "";
        }
        if (codeDisplay) codeDisplay.textContent = "Código: " + "*".repeat(codigoInserido.length);
    } else if (!isNaN(val) && val !== " ") {
        if (codigoInserido.length < 4) {
            codigoInserido += val;
            if (codeDisplay) codeDisplay.textContent = "Código: " + "*".repeat(codigoInserido.length);
        }
    }
}
