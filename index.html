<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<title>C4 — Desarmar</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
<h1>C4 <em>Desarmar</em></h1>
<div class="panel">
  <div class="hud" id="hud"><small id="lbl">Aguardando</small><div class="time" id="lcd">--:--</div><div class="bar"><i id="bar"></i></div></div>
  <div class="status" id="st">Aguardando o administrador armar a bomba.</div>
  <div class="pad" id="pad"></div>
</div>
</main>
 
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getDatabase, ref, onValue, set, update, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
 
const firebaseConfig = {
  apiKey: "AIzaSyDwHJLKes6j9ZNnaObER_tnrwuFe-Jk-k4",
  authDomain: "spike-3301.firebaseapp.com",
  databaseURL: "https://spike-3301-default-rtdb.firebaseio.com",
  projectId: "spike-3301",
  storageBucket: "spike-3301.firebasestorage.app",
  messagingSenderId: "309291386168",
  appId: "1:309291386168:web:074fb3d69aac7517a76dcd",
  measurementId: "G-FCNQGJ7DRX"
};
 
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
 
var S={total:30,left:30,armed:false,entry:"",armId:null,fimEm:0,maxEnd:0,fin:false},tm=null,ac=null;
 
// Relógio do servidor Firebase (evita diferença entre os relógios dos aparelhos)
var off=0;
onValue(ref(db,'.info/serverTimeOffset'),function(sn){off=sn.val()||0});
function now(){return Date.now()+off}
var $=function(i){return document.getElementById(i)};
var lcd=$("lcd"),hud=$("hud"),bar=$("bar"),st=$("st"),lbl=$("lbl");
 
function fmt(s){return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}
function beep(f,d){try{if(!ac||ac.state!=="running")return;var o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;g.gain.value=.08;o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}
 
function draw(c){
    lcd.textContent=fmt(S.left);
    bar.style.width=(S.armed? Math.min(100,S.left/S.total*100)+"%" : "0%");
    hud.className="hud "+(c||(S.armed&&S.left<=10?"hot":""));
}
 
function stop(){clearInterval(tm);S.armed=false}
 
function tick(){
 if(!S.armed) return;
 var nl=Math.max(0,Math.ceil((S.fimEm-now())/1000));
 if(nl===S.left) return;
 S.left=nl;
 if(S.left<=0){
    stop();
    S.fin=true;
    lbl.textContent="Detonada";
    draw("hot");
    st.textContent="A bomba detonou! Sistema Comprometido.";
    beep(150,.8);
    set(ref(db, 'bomba/status'), 'DETONADA');
    return;
 }
 beep(S.left<10?1400:900,.06);
 draw();
}
 
const bombaRef = ref(db, 'bomba');
onValue(bombaRef, (snapshot) => {
    const data = snapshot.val();
    if (!data) return;
 
    if (data.status === 'ARMADA') {
        S.total = data.tempoTotal || 30;
        
        if (!S.armed || data.armId !== S.armId) {
            stop();
            S.armId = data.armId;
            S.fimEm = (typeof data.fimEm === 'number') ? data.fimEm : now() + (data.tempoRestante || S.total) * 1000;
            // trava de segurança: nunca pode faltar mais que o tempo total
            S.maxEnd = now() + S.total * 1000 + 1000;
            S.fimEm = Math.min(S.fimEm, S.maxEnd);
            S.left = Math.max(0, Math.ceil((S.fimEm - now()) / 1000));
            S.entry = "";
            S.fin = false;
            S.armed = true;
            lbl.textContent = "Bomba armada";
            st.textContent = "ARMADA! Digite o código e aperte Confirmar";
            draw();
            tm = setInterval(tick, 250);
        } else if (typeof data.fimEm === 'number' && data.fimEm !== S.fimEm) {
            S.fimEm = Math.min(data.fimEm, S.maxEnd);
            tick();
        }
    } else if (data.status === 'DESARMADA' || !data.status) {
        if (S.armed && !data.reset) {
            stop();
            S.fin = true;
            lbl.textContent = "Desarmada";
            draw("ok");
            st.textContent="Bomba desarmada!";
        } else if (data.reset || !S.fin) {
            // início / reset: volta para "Aguardando"
            stop();
            S.fin = false;
            S.left = S.total;
            lbl.textContent = "Aguardando";
            st.textContent = "Aguardando o administrador armar a bomba.";
            draw();
            lcd.textContent = "--:--";
        }
    }
});
 
// Áudio (Web Audio)
function audio(){
 ac=ac||new (window.AudioContext||window.webkitAudioContext)();
 if(ac.state==="suspended") ac.resume();
}
 
// Libera o áudio no primeiro toque/tecla. Antes disso o navegador deixa o áudio suspenso,
// e os bips do contador não tocam (evita acumular bips e soltar tudo junto no primeiro clique).
["pointerdown","keydown"].forEach(function(ev){
 document.addEventListener(ev,function(){try{audio()}catch(e){}},{passive:true});
});
 
// Clique de tecla: ~25 ms de seno em 2307 Hz
function clique(){
 try{
  audio();
  var t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();
  o.type="sine";
  o.frequency.value=2307;
  g.gain.setValueAtTime(0,t);
  g.gain.linearRampToValueAtTime(.33,t+.002);
  g.gain.setValueAtTime(.33,t+.021);
  g.gain.linearRampToValueAtTime(0,t+.025);
  o.connect(g);g.connect(ac.destination);
  o.start(t);o.stop(t+.03);
 }catch(e){}
}
 
// Som de erro: dois tons graves descendentes (buzzer "negado")
function somErro(){
 try{
  audio();
  var t=ac.currentTime;
  [[220,0],[165,.18]].forEach(function(n){
   var o=ac.createOscillator(),g=ac.createGain();
   o.type="sawtooth";
   o.frequency.value=n[0];
   g.gain.setValueAtTime(0,t+n[1]);
   g.gain.linearRampToValueAtTime(.15,t+n[1]+.01);
   g.gain.setValueAtTime(.15,t+n[1]+.14);
   g.gain.linearRampToValueAtTime(0,t+n[1]+.17);
   o.connect(g);g.connect(ac.destination);
   o.start(t+n[1]);o.stop(t+n[1]+.18);
  });
 }catch(e){}
}
 
// Som de acerto: três tons ascendentes (estilo "bomba desarmada")
function somAcerto(){
 try{
  audio();
  var t=ac.currentTime;
  [[660,0],[880,.12],[1320,.24]].forEach(function(n){
   var o=ac.createOscillator(),g=ac.createGain();
   o.type="sine";
   o.frequency.value=n[0];
   g.gain.setValueAtTime(0,t+n[1]);
   g.gain.linearRampToValueAtTime(.2,t+n[1]+.01);
   g.gain.setValueAtTime(.2,t+n[1]+.18);
   g.gain.linearRampToValueAtTime(0,t+n[1]+.3);
   o.connect(g);g.connect(ac.destination);
   o.start(t+n[1]);o.stop(t+n[1]+.32);
  });
 }catch(e){}
}
 
// Validação segura do código diretamente no Firebase ao pressionar #
async function press(k){
 if(!S.armed) return;
 if(k!=="#") clique();
 if(k==="*"){S.entry="";st.textContent="Entrada limpa"}
 else if(k==="#"){
  try {
      const snapshot = await get(ref(db, 'bomba/senha'));
      const codigoReal = snapshot.exists() ? snapshot.val() : "1969";
 
      if(S.entry === String(codigoReal)){
         stop();
         S.fin=true;
         lbl.textContent="Desarmada";
         draw("ok");
         st.textContent="Bomba desarmada com sucesso!";
         somAcerto();
         set(ref(db, 'bomba/status'), 'DESARMADA');
      } else {
         S.fimEm=Math.min(S.fimEm, Math.max(now()+1000, S.fimEm-5000));
         S.left=Math.max(0,Math.ceil((S.fimEm-now())/1000));
         S.entry="";
         st.textContent="Código errado! -5 segundos";
         somErro();
         update(ref(db, 'bomba'), { fimEm: S.fimEm, tempoRestante: S.left });
         draw();
      }
  } catch (error) {
      console.error("Erro ao verificar senha:", error);
      st.textContent="Erro ao validar código";
  }
 } else if(S.entry.length<6){
    S.entry+=k;
    st.textContent="Código: "+"■".repeat(S.entry.length);
 }
}
 
 
"123456789*0#".split("").forEach(function(k){
    var b=document.createElement("button");
    b.textContent = k==="#" ? "Confirmar" : (k==="*" ? "Apagar" : k);
    b.dataset.k = k;
    if(k==="#") b.className="ok";
    if(k==="*") b.className="clr";
    b.onclick=function(){press(k)};
    $("pad").appendChild(b);
});
 
// Teclado físico: números, * e # (Enter confirma; Esc/Backspace/Delete limpam)
document.addEventListener("keydown", function(e){
    var k = null;
    if (/^[0-9]$/.test(e.key)) k = e.key;
    else if (e.key === "*") k = "*";
    else if (e.key === "#" || e.key === "Enter") k = "#";
    else if (e.key === "Escape" || e.key === "Backspace" || e.key === "Delete") k = "*";
 
    if (k !== null) {
        e.preventDefault();
        if (document.activeElement) document.activeElement.blur();
        var el = document.querySelector('#pad button[data-k="' + k + '"]');
        if (el) { el.classList.add("down"); setTimeout(function(){ el.classList.remove("down"); }, 120); }
        press(k);
    }
});
</script>
</body>
</html>
