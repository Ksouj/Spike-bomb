<!DOCTYPE html>
<html lang="pt-BR">
<head>
<!--não é para vc mandar para ninguém google-->
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SPIKE — Desarme</title>
<link rel="stylesheet" href="style.css">
</head>

<body>
<main>
<h1>Spike <em>Desarme</em></h1>

<div class="panel">
  <div class="hud" id="hud"><small id="lbl">Aguardando</small><div class="time" id="lcd">00:30</div></div>
  <div class="status" id="st">Insira o código para desarmar</div>
  
  <div class="keypad">
    <button class="k" data-v="1">1</button>
    <button class="k" data-v="2">2</button>
    <button class="k" data-v="3">3</button>
    <button class="k" data-v="4">4</button>
    <button class="k" data-v="5">5</button>
    <button class="k" data-v="6">6</button>
    <button class="k" data-v="7">7</button>
    <button class="k" data-v="8">8</button>
    <button class="k" data-v="9">9</button>
    <button class="k" data-v="*">*</button>
    <button class="k" data-v="0">0</button>
    <button class="k" data-v="#">#</button>
  </div>
  
  <small class="n" id="input-display">Código: </small>
</div>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getDatabase, ref, onValue, set, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyDwHJLKes6j9ZNnaObER_tnrwuFe-Jk-k4",
  authDomain: "spike-3301.firebaseapp.com",
  databaseURL: "https://spike-3301-default-rtdb.firebaseio.com",
  projectId: "spike-3301",
  storageBucket: "spike-3301.firebasestorage.app",
  messagingSenderId: "309291386168",
  appId: "1:309291386168:web:074fb3d69aac7517a76dcd",
  measurementId: "G-FCNQGJ7DRX"
};

let db;
try {
  const app = initializeApp(firebaseConfig);
  db = getDatabase(app);
} catch (e) {
  console.error("Erro ao iniciar Firebase:", e);
}

var $=function(i){return document.getElementById(i)};
var lcd=$("lcd"),hud=$("hud"),st=$("st"),lbl=$("lbl"),inputDisplay=$("input-display");

var codigoDigitado = "";
var senhaCorreta = "4321";
var statusAtual = "AGUARDANDO";
var tempoRestanteLocal = 30;

function fmt(s){return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}

function draw(c){
    if(lcd) lcd.textContent = fmt(tempoRestanteLocal);
    if(hud) hud.className = "hud " + (c || (statusAtual === 'ARMADA' && tempoRestanteLocal <= 10 ? "hot" : ""));
}

// Escuta em tempo real todas as alterações vindas do Firebase (incluindo o painel admin)
if(db) {
    onValue(ref(db, 'bomba'), (snapshot) => {
        const data = snapshot.val();
        if (!data) return;

        statusAtual = data.status || "AGUARDANDO";
        if (data.senha) senhaCorreta = String(data.senha);
        if (data.tempoRestante !== undefined) {
            tempoRestanteLocal = Number(data.tempoRestante);
        }

        if (statusAtual === 'ARMADA') {
            lbl.textContent = "Bomba Armada";
            st.textContent = "Insira o código de desarme e aperte #";
            draw();
        } else if (statusAtual === 'DESARMADA') {
            lbl.textContent = "Desarmada";
            st.textContent = "Bomba desarmada com sucesso!";
            draw("ok");
            codigoDigitado = "";
            inputDisplay.textContent = "Código: ";
        } else if (statusAtual === 'DETONADA') {
            lbl.textContent = "Detonada";
            st.textContent = "A bomba detonou!";
            draw("hot");
        } else {
            lbl.textContent = "Aguardando";
            st.textContent = "Aguardando o Administrador armar...";
            draw();
        }
    });
}

// Teclado virtual do jogador
document.querySelectorAll('.k').forEach(button => {
    button.onclick = function() {
        if (statusAtual !== 'ARMADA') return;
        
        const val = this.getAttribute('data-v');

        if (val === '#') {
            // Valida o código inserido
            if (codigoDigitado === senhaCorreta) {
                st.textContent = "Código Correto! Desarmando...";
                if(db) {
                    set(ref(db, 'bomba/status'), 'DESARMADA');
                }
            } else {
                st.textContent = "Código Incorreto!";
                codigoDigitado = "";
                inputDisplay.textContent = "Código: ";
            }
        } else if (val === '*') {
            // Limpa o input atual
            codigoDigitado = "";
            inputDisplay.textContent = "Código: ";
        } else {
            // Adiciona número (limite de 4 dígitos)
            if (codigoDigitado.length < 4) {
                codigoDigitado += val;
                inputDisplay.textContent = "Código: " + "*".repeat(codigoDigitado.length);
            }
        }
    };
});

draw();
</script>
</body>
</html>
