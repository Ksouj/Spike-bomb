<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Desarme de Bomba</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 50px;
        }
        #timer {
            font-size: 80px;
            color: #ff3333;
            margin: 20px 0;
            font-weight: bold;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: #1e1e1e;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.3);
        }
        input, button {
            padding: 12px;
            font-size: 18px;
            margin: 10px 0;
            border-radius: 5px;
            border: none;
        }
        input {
            width: 80%;
            text-align: center;
        }
        button {
            background-color: #ff3333;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #cc0000;
        }
        #statusDisplay {
            font-size: 20px;
            margin-bottom: 15px;
            color: #ffcc00;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>BOMBA ATIVADA</h1>
        <div id="statusDisplay">A aguardar início...</div>
        <div id="timer">--:--</div>

        <div id="desarmeSection">
            <input type="password" id="inputCodigoDesarme" placeholder="Código de Desarme (ex: 1234)">
            <br>
            <button onclick="tentarDesarmarBomba()">DESARMAR BOMBA</button>
        </div>
    </div>

    <!-- Script do Firebase v10 (Modular) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getDatabase, ref, onValue, get, set } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

        // CONFIGURAÇÃO DO TEU FIREBASE (Substitui com os teus dados reais se necessário)
        const firebaseConfig = {
            databaseURL: "https://spike-3301-default-rtdb.firebaseio.com"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const statusDisplay = document.getElementById("statusDisplay");
        const timerDisplay = document.getElementById("timer");

        // Monitoriza o status da bomba em tempo real
        onValue(ref(db, 'pump/status'), (snapshot) => {
            const status = snapshot.val();
            
            if (status === "ARMADA") {
                statusDisplay.innerText = "ESTADO: ARMADA ⚠️";
                timerDisplay.style.color = "#ff3333";
            } else if (status === "DESARMADA") {
                statusDisplay.innerText = "ESTADO: BOMBA DESARMADA! 🎉";
                timerDisplay.style.color = "#00cc66";
                timerDisplay.innerText = "00:00";
            } else if (status === "DETONADA") {
                statusDisplay.innerText = "ESTADO: BOOOOOOOM! 💥";
                timerDisplay.style.color = "#ff0000";
                timerDisplay.innerText = "00:00";
            } else {
                statusDisplay.innerText = "ESTADO: AGUARDANDO...";
            }
        });

        // Função segura para validar o código de desarme direto no Firebase
        window.tentarDesarmarBomba = async function() {
            const codigoDigitado = document.getElementById("inputCodigoDesarme").value;
            const codigoRef = ref(db, 'pump/config/codigoDesarme');

            try {
                const snapshot = await get(codigoRef);
                if (snapshot.exists()) {
                    const codigoReal = snapshot.val();

                    if (codigoDigitado === String(codigoReal)) {
                        set(ref(db, 'pump/status'), 'DESARMADA');
                        alert("SUCESSO! Bomba desarmada a tempo!");
                    } else {
                        alert("Código incorreto! Tenta novamente.");
                    }
                } else {
                    alert("Erro de configuração do código no servidor.");
                }
            } catch (error) {
                console.error("Erro ao verificar código:", error);
                alert("Erro de ligação ao servidor.");
            }
        };
    </script>
</body>
</html>
